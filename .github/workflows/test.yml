name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: acuity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Migrate Test DB
        working-directory: backend/node-api
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/acuity_test?schema=public
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run Backend Tests
        working-directory: backend/node-api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/acuity_test?schema=public
          ENFORCE_EDU_DOMAIN: false
        run: npm test

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test
