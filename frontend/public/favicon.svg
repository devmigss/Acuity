<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="eyeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded plate (removable if you want pure transparency) -->
  <rect width="120" height="120" rx="26" fill="#0b1727" />

  <!-- Outer Eye Shell -->
  <path d="M 14 60 C 34 26, 86 26, 106 60 C 86 94, 34 94, 14 60 Z" 
        fill="none" 
        stroke="url(#eyeBlueGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Highlighting Arc -->
  <path d="M 28 60 C 42 36, 78 36, 92 60" 
        fill="none" 
        stroke="#7dd3fc" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.85"/>

  <!-- Center Outer Iris Ring -->
  <circle cx="60" cy="60" r="22" 
        fill="none" 
        stroke="url(#eyeBlueGrad)" 
        stroke-width="5" />

  <!-- Aperture Accent Arc -->
  <path d="M 44 50 A 20 20 0 0 1 76 50" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        filter="url(#softGlow)"/>

  <!-- Center Pupil / Lens Core -->
  <circle cx="60" cy="60" r="11" fill="url(#lensGrad)"/>
  
  <!-- Optical Light Reflection Glint -->
  <circle cx="56" cy="56" r="3.5" fill="#ffffff"/>
</svg>
